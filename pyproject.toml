[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "passivelab"
version = "0.0.0"
description = "A platform to automate passive structure generation, validation, optimization, exploration, and inverse design."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
# gdstk lands here in sub-phase 1.1.2 (the L3 Generator backend, per the gdstk-vs-gdspy
# matrix in docs/GENERATOR_COMPARISON_MATRIX.md). Further runtime deps (openEMS/torch/
# optuna/ngspice bindings) are added per sub-phase, as the PRD's interfaces land.
dependencies = ["gdstk>=0.9"]

[project.optional-dependencies]
# Keep `dev` minimal so CI stays fast.
dev = ["pytest>=8"]
# Benchmark-ecosystem tooling (algorithm/backend comparisons) — not part of the fast CI gate,
# run on demand: pytest benchmark/ --benchmark-only. See benchmark/geometry/tcoil/README.md.
bench = ["pytest-benchmark>=4", "matplotlib>=3.8"]
# PNG preview rendering (utils/preview.py) — the CLI's default output, `pip install -e ".[viz]"`.
# Deliberately overlaps `bench`'s matplotlib pin rather than restructuring that extras group.
viz = ["matplotlib>=3.8"]
# openEMS SimulationBackend (sub-phase 1.4.1, characterization/openems/). openEMS/CSXCAD are
# compiled FDTD-solver packages, not installable this way on every platform — this extra pins the
# Python-side pieces; see characterization/openems/vendor/NOTICE for the vendored PDK helper
# modules these wrap. Pinned to match the golden reference's own environment table exactly
# (reference/python/TCoil_Dataset_Generator_and_Training.py:109,134) for 1.4.5's later
# notebook-equivalence check. `numpy` is required by the vendored PDK modules directly (not a
# core PassiveLAB dependency). No `gdspy` here — the vendored PDK GDS reader originally required
# it, which would have reintroduced exactly the Windows/no-wheel/unmaintained-upstream install
# pain `DEC-adopt-gdstk-as-the-l3-generator-backend-0002` already replaced it for; sub-phase 1.4.6
# ported `util_gds_reader.py` to gdstk instead (see vendor/NOTICE). Deliberately NOT added to
# `dev`, so CI (`pip install -e ".[dev]"`) stays green without a compiled FDTD solver — see
# characterization/openems/tests/test_plugin.py's `pytest.importorskip` guard.
sim = ["openEMS==0.0.36", "CSXCAD==0.6.2", "numpy>=1.26"]

[project.scripts]
passivelab = "passivelab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# "tests" = whole-package tests (see tests/GOAL.md); "src" picks up each device's own
# geometry/<device>/tests/ folder (see src/passivelab/geometry/GOAL.md). `benchmark/` is
# deliberately excluded -- run on demand via `pytest benchmark/ --benchmark-only`.
testpaths = ["tests", "src"]
addopts = "-q"
